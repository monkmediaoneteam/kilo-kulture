<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Pin Gradients in Kilo Kulture Brand Colors -->
    <linearGradient id="pinBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e44c8"/>
      <stop offset="50%" stop-color="#0a2a94"/>
      <stop offset="100%" stop-color="#051652"/>
    </linearGradient>
    <linearGradient id="pinRightShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#041242" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#0a2a94"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0a2a94" flood-opacity="0.25"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ================= PERSPECTIVE 3D MAP GRID ================= -->
  <g id="map-grid" opacity="0.88">
    <!-- Map ground plane with street blocks -->
    <!-- Row 1 (Back) -->
    <polygon points="120,440 160,375 220,375 190,440" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="205,440 232,375 315,375 300,440" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="315,440 328,375 410,375 410,440" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="425,440 422,375 470,375 480,440" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Row 2 (Middle) -->
    <polygon points="90,510 115,450 185,450 150,510" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="165,510 198,450 295,450 270,510" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="285,510 310,450 410,450 400,510" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="415,510 423,450 495,450 505,510" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

    <!-- Row 3 (Front) -->
    <polygon points="60,570 85,520 145,520 110,570" fill="#94a3b8" opacity="0.7" stroke="#64748b" stroke-width="2"/>
    <polygon points="125,570 160,520 265,520 230,570" fill="#94a3b8" opacity="0.7" stroke="#64748b" stroke-width="2"/>
    <polygon points="245,570 280,520 395,520 375,570" fill="#94a3b8" opacity="0.7" stroke="#64748b" stroke-width="2"/>
    <polygon points="390,570 410,520 515,520 525,570" fill="#94a3b8" opacity="0.7" stroke="#64748b" stroke-width="2"/>

    <!-- Navigation Route Path (Orange to Kilo Kulture Blue) -->
    <path d="M 160 550 C 180 520, 200 520, 240 520 L 400 520 C 430 520, 440 480, 410 470 L 320 470 C 290 470, 290 415, 300 410" 
          fill="none" stroke="#f59e0b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 160 550 C 180 520, 200 520, 240 520 L 400 520 C 430 520, 440 480, 410 470 L 320 470 C 290 470, 290 415, 300 410" 
          fill="none" stroke="#ffd500" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Start & Destination Dots -->
    <circle cx="160" cy="550" r="14" fill="#94a3b8"/>
    <circle cx="160" cy="550" r="8" fill="#ffffff"/>
    
    <!-- Pin shadow on ground -->
    <ellipse cx="300" cy="410" rx="38" ry="12" fill="#0a2a94" opacity="0.35"/>
    <circle cx="300" cy="410" r="9" fill="#0a2a94"/>
    <circle cx="300" cy="410" r="4" fill="#ffd500"/>
  </g>

  <!-- ================= GIANT TEARDROP LOCATION PIN ================= -->
  <g id="map-pin" filter="url(#pinShadow)">
    <!-- Outer Teardrop Pin Shape (Centered at X:300, Point at X:300 Y:405) -->
    <path d="M 300 405 
             C 240 330, 160 270, 160 180 
             A 140 140 0 1 1 440 180 
             C 440 270, 360 330, 300 405 Z" 
          fill="url(#pinBodyGrad)" stroke="#051652" stroke-width="4"/>
    
    <!-- Right side 3D shading -->
    <path d="M 300 405 
             C 300 405, 300 320, 300 40 
             A 140 140 0 0 1 440 180 
             C 440 270, 360 330, 300 405 Z" 
          fill="url(#pinRightShade)"/>

    <!-- Inner White Circle -->
    <circle cx="300" cy="180" r="102" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" filter="url(#softGlow)"/>

    <!-- ================= STOREFRONT INSIDE PIN ================= -->
    <g id="storefront" transform="translate(195, 85)">
      <!-- Store Wall / Building Structure -->
      <rect x="25" y="65" width="160" height="110" rx="4" fill="#f8fafc" stroke="#0a2a94" stroke-width="3"/>
      <rect x="28" y="165" width="154" height="10" fill="#e2e8f0"/>

      <!-- Store Signboard (Kilo Kulture Royal Blue) -->
      <rect x="35" y="42" width="140" height="34" rx="6" fill="#0a2a94" stroke="#051652" stroke-width="2.5"/>
      <text x="105" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffd500" text-anchor="middle" letter-spacing="1.5">STORE</text>

      <!-- Awning (Striped Scallops in Kilo Kulture Brand Colors: Blue & Yellow) -->
      <g id="awning">
        <!-- Stripe 1 (Blue) -->
        <path d="M 20 76 L 30 112 L 48 112 L 40 76 Z" fill="#0a2a94"/>
        <path d="M 30 112 Q 39 122, 48 112 Z" fill="#0a2a94"/>
        <!-- Stripe 2 (Yellow) -->
        <path d="M 40 76 L 48 112 L 68 112 L 60 76 Z" fill="#ffd500"/>
        <path d="M 48 112 Q 58 122, 68 112 Z" fill="#ffd500"/>
        <!-- Stripe 3 (Blue) -->
        <path d="M 60 76 L 68 112 L 88 112 L 80 76 Z" fill="#0a2a94"/>
        <path d="M 68 112 Q 78 122, 88 112 Z" fill="#0a2a94"/>
        <!-- Stripe 4 (Yellow) -->
        <path d="M 80 76 L 88 112 L 108 112 L 100 76 Z" fill="#ffd500"/>
        <path d="M 88 112 Q 98 122, 108 112 Z" fill="#ffd500"/>
        <!-- Stripe 5 (Blue) -->
        <path d="M 100 76 L 108 112 L 128 112 L 120 76 Z" fill="#0a2a94"/>
        <path d="M 108 112 Q 118 122, 128 112 Z" fill="#0a2a94"/>
        <!-- Stripe 6 (Yellow) -->
        <path d="M 120 76 L 128 112 L 148 112 L 140 76 Z" fill="#ffd500"/>
        <path d="M 128 112 Q 138 122, 148 112 Z" fill="#ffd500"/>
        <!-- Stripe 7 (Blue) -->
        <path d="M 140 76 L 148 112 L 168 112 L 160 76 Z" fill="#0a2a94"/>
        <path d="M 148 112 Q 158 122, 168 112 Z" fill="#0a2a94"/>
        <!-- Stripe 8 (Yellow) -->
        <path d="M 160 76 L 168 112 L 186 112 L 180 76 Z" fill="#ffd500"/>
        <path d="M 168 112 Q 177 122, 186 112 Z" fill="#ffd500"/>
      </g>

      <!-- Windows & Glass Doors -->
      <!-- Left Display Window with Clothes Hanger Silhouette -->
      <rect x="36" y="126" width="38" height="38" rx="3" fill="#e0f2fe" stroke="#0a2a94" stroke-width="2.2"/>
      <path d="M 44 142 L 55 133 L 66 142 Z" fill="none" stroke="#0a2a94" stroke-width="2"/>
      <circle cx="55" cy="131" r="2" fill="#0a2a94"/>
      <line x1="55" y1="142" x2="55" y2="156" stroke="#0a2a94" stroke-width="2"/>

      <!-- Center Door -->
      <rect x="85" y="120" width="40" height="54" rx="2" fill="#ffffff" stroke="#0a2a94" stroke-width="2.5"/>
      <rect x="90" y="125" width="30" height="26" fill="#e0f2fe" stroke="#0a2a94" stroke-width="1.8"/>
      <rect x="94" y="130" width="22" height="10" rx="2" fill="#ffd500" stroke="#0a2a94" stroke-width="1.2"/>
      <text x="105" y="138" font-family="sans-serif" font-size="7" font-weight="900" fill="#0a2a94" text-anchor="middle">OPEN</text>
      <!-- Door handle -->
      <line x1="88" y1="146" x2="88" y2="154" stroke="#0a2a94" stroke-width="3" stroke-linecap="round"/>

      <!-- Right Display Window with Clothes Folded Stack -->
      <rect x="136" y="126" width="38" height="38" rx="3" fill="#e0f2fe" stroke="#0a2a94" stroke-width="2.2"/>
      <rect x="144" y="148" width="22" height="5" rx="2" fill="#ffd500"/>
      <rect x="146" y="142" width="18" height="5" rx="2" fill="#0a2a94"/>
      <rect x="148" y="136" width="14" height="5" rx="2" fill="#f97316"/>
    </g>
  </g>
</svg>
